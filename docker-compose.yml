services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shifts
      POSTGRES_PASSWORD: shifts
      POSTGRES_DB: shifts
    ports:
      # 5433 снаружи, чтобы не конфликтовать с PostgreSQL, установленной на компьютере.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shifts -d shifts"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://shifts:shifts@postgres:5432/shifts?sslmode=disable
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
